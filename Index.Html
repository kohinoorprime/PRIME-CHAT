<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIME CHAT</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="logo">
      P
    </div>

    <h1>PRIME CHAT</h1>

    <p class="tagline">
      Connect. Chat. Stay Together.
    </p>

    <div class="login-box">

      <h2>Welcome Back</h2>

      <p class="subtitle">
        Login to continue
      </p>

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="loginBtn">
        LOGIN
      </button>

      <div class="or">
        <span>OR</span>
      </div>

      <button class="create-btn" id="signupBtn">
        CREATE ACCOUNT
      </button>

    </div>

    <p class="footer">
      © 2026 PRIME CHAT
    </p>

  </div>

  <script src="app.js"></script>

</body>
</html>
